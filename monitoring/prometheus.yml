# Prometheus Configuration for Space Debris Tracking System
# This configuration sets up monitoring for all system components

global:
  scrape_interval: 15s # Scrape targets every 15 seconds
  scrape_timeout: 10s # Timeout after 10 seconds
  evaluation_interval: 15s # Evaluate rules every 15 seconds
  external_labels:
    cluster: 'space-debris-tracker'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Load rules once and periodically evaluate them
rule_files:
  - '/etc/prometheus/rules/*.yml'

# Scrape configurations
scrape_configs:
  # ===========================================================================
  # API Server Monitoring
  # ===========================================================================
  - job_name: 'space-tracker-api'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'api:8000'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - target_label: service
        replacement: 'api'

  # ===========================================================================
  # Dashboard Monitoring
  # ===========================================================================
  - job_name: 'space-tracker-dashboard'
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'dashboard:8501'
    relabel_configs:
      - target_label: service
        replacement: 'dashboard'

  # ===========================================================================
  # GPU Metrics (NVIDIA DCGM Exporter)
  # ===========================================================================
  - job_name: 'gpu-metrics'
    scrape_interval: 10s
    static_configs:
      - targets:
          - 'nvidia-dcgm-exporter:9400'
    relabel_configs:
      - target_label: service
        replacement: 'gpu'
    metric_relabel_configs:
      # Keep only important GPU metrics
      - source_labels: [__name__]
        regex: 'DCGM_(FI_DEV_GPU_UTIL|FI_DEV_MEM_COPY_UTIL|FI_DEV_FB_USED|FI_DEV_FB_FREE|FI_DEV_POWER_USAGE|FI_DEV_GPU_TEMP)'
        action: keep

  # ===========================================================================
  # Database Monitoring
  # ===========================================================================

  # Neo4j Graph Database
  - job_name: 'neo4j'
    scrape_interval: 15s
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'neo4j:2004'
    relabel_configs:
      - target_label: service
        replacement: 'neo4j'

  # PostgreSQL Database
  - job_name: 'postgresql'
    scrape_interval: 15s
    static_configs:
      - targets:
          - 'postgres-exporter:9187'
    relabel_configs:
      - target_label: service
        replacement: 'postgresql'

  # Redis Cache
  - job_name: 'redis'
    scrape_interval: 15s
    static_configs:
      - targets:
          - 'redis-exporter:9121'
    relabel_configs:
      - target_label: service
        replacement: 'redis'

  # ===========================================================================
  # Kafka Monitoring
  # ===========================================================================
  - job_name: 'kafka'
    scrape_interval: 15s
    static_configs:
      - targets:
          - 'kafka-exporter:9308'
    relabel_configs:
      - target_label: service
        replacement: 'kafka'

  - job_name: 'kafka-lag-exporter'
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'kafka-lag-exporter:9999'
    relabel_configs:
      - target_label: service
        replacement: 'kafka-lag'

  # ===========================================================================
  # Kubernetes Monitoring (if deployed on K8s)
  # ===========================================================================
  - job_name: 'kubernetes-apiservers'
    kubernetes_sd_configs:
      - role: endpoints
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: default;kubernetes;https

  - job_name: 'kubernetes-nodes'
    kubernetes_sd_configs:
      - role: node
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)

  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name

  # ===========================================================================
  # Application-Specific Metrics
  # ===========================================================================

  # Computer Vision Pipeline
  - job_name: 'cv-pipeline'
    scrape_interval: 10s
    static_configs:
      - targets:
          - 'cv-detector:8001'
          - 'cv-tracker:8002'
    relabel_configs:
      - target_label: service
        replacement: 'computer-vision'

  # Trajectory Prediction Engine
  - job_name: 'trajectory-prediction'
    scrape_interval: 15s
    static_configs:
      - targets:
          - 'trajectory-predictor:8003'
    relabel_configs:
      - target_label: service
        replacement: 'trajectory-prediction'

  # Monitoring Agents
  - job_name: 'monitoring-agents'
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'agent-coordinator:8004'
    relabel_configs:
      - target_label: service
        replacement: 'agents'

  # ===========================================================================
  # Node Exporter (System Metrics)
  # ===========================================================================
  - job_name: 'node-exporter'
    scrape_interval: 15s
    static_configs:
      - targets:
          - 'node-exporter:9100'
    relabel_configs:
      - target_label: service
        replacement: 'node'

  # ===========================================================================
  # cAdvisor (Container Metrics)
  # ===========================================================================
  - job_name: 'cadvisor'
    scrape_interval: 15s
    static_configs:
      - targets:
          - 'cadvisor:8080'
    relabel_configs:
      - target_label: service
        replacement: 'cadvisor'

  # ===========================================================================
  # Prometheus Self-Monitoring
  # ===========================================================================
  - job_name: 'prometheus'
    scrape_interval: 10s
    static_configs:
      - targets:
          - 'localhost:9090'
    relabel_configs:
      - target_label: service
        replacement: 'prometheus'

# ===========================================================================
# Remote Write (Optional - for long-term storage)
# ===========================================================================
# Uncomment to enable remote write to systems like Thanos, Cortex, etc.
