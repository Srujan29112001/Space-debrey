[pytest]
# Pytest Configuration for Space Debris Tracking System

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 7.0

# Command line options
addopts =
    # Verbose output
    -v
    --tb=short

    # Coverage
    --cov=space_debris_tracker
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml
    --cov-branch
    --cov-fail-under=80

    # Parallel execution
    -n auto

    # Show slowest tests
    --durations=10

    # Warnings
    -W ignore::DeprecationWarning
    -W ignore::PendingDeprecationWarning

    # Show local variables in tracebacks
    --showlocals

    # Strict markers
    --strict-markers

    # Capture output
    --capture=no

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for workflows
    performance: Performance and benchmark tests
    slow: Tests that take a long time to run
    gpu: Tests requiring GPU
    network: Tests requiring network access
    database: Tests requiring database
    kafka: Tests requiring Kafka
    neo4j: Tests requiring Neo4j
    api: API endpoint tests
    model: Tests involving ML models

# Asyncio configuration
asyncio_mode = auto

# Timeout for tests (seconds)
timeout = 300

# Coverage configuration
[coverage:run]
source = space_debris_tracker
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */env/*
    setup.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
