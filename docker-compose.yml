version: '3.8'

services:
  # API Server
  api:
    build: .
    container_name: space-debris-api
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      - neo4j
      - redis
    networks:
      - space-network
    restart: unless-stopped

  # Dashboard
  dashboard:
    build: .
    container_name: space-debris-dashboard
    command: streamlit run space_debris_tracker/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - space-network
    restart: unless-stopped

  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.14
    container_name: space-debris-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - space-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: space-debris-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - space-network
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: space-debris-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=space_tracking
      - POSTGRES_USER=spaceuser
      - POSTGRES_PASSWORD=spacepass
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - space-network
    restart: unless-stopped

  # Kafka (for streaming data)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: space-debris-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - space-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: space-debris-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - space-network

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: space-debris-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - space-network
    restart: unless-stopped

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: space-debris-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    networks:
      - space-network
    restart: unless-stopped

networks:
  space-network:
    driver: bridge

volumes:
  neo4j-data:
  neo4j-logs:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:
